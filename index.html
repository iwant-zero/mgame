<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>100층 던전 공략: 확장판 (Fix)</title>
    <style>
        body { margin: 0; background: #000; color: #fff; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; }
        canvas { display: block; background: #000; touch-action: none; }
        
        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .hud { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.85); padding: 12px; border-radius: 8px; border: 2px solid #00aaff; pointer-events: auto; min-width: 150px; }
        .skill-bar { margin-top: 10px; height: 10px; background: #333; border-radius: 5px; overflow: hidden; }
        #skill-fill { width: 100%; height: 100%; background: #00aaff; transition: width 0.1s; }
        
        .shop-btn { background: #222; color: #00aaff; border: 1px solid #00aaff; padding: 5px 10px; cursor: pointer; margin-right: 5px; margin-top: 5px; font-weight: bold; }
        #modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                  background: rgba(10, 10, 10, 0.98); padding: 25px; border: 3px solid #00aaff; border-radius: 15px; 
                  pointer-events: auto; min-width: 300px; z-index: 100; box-shadow: 0 0 20px #00aaff; }
        .item-row { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center; background: #1a1a1a; padding: 8px; border-radius: 5px; }
        .close-btn { float: right; cursor: pointer; color: #ff4444; font-weight: bold; font-size: 20px; }

        #virtual-pad { position: absolute; bottom: 20px; left: 20px; display: none; pointer-events: auto; }
        .pad-row { display: flex; justify-content: center; }
        .pad-btn { width: 60px; height: 60px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); border-radius: 15px; margin: 3px; text-align: center; line-height: 60px; font-size: 24px; user-select: none; }
        #btn-skill { background: rgba(0, 170, 255, 0.4); border: 2px solid #00aaff; width: 70px; height: 70px; border-radius: 50%; margin-left: 15px; font-size: 16px; font-weight: bold; }
        
        @media (max-width: 768px) { #virtual-pad { display: flex; align-items: flex-end; } }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-container">
    <div class="hud">
        <div style="font-size: 1.1em; color: #00aaff; font-weight: bold;">[ <span id="cur-floor">1</span>F ] <span id="theme-name">철의 던전</span></div>
        <div style="margin: 5px 0;">HP: <span id="hp">100</span> / <span id="maxHp">100</span></div>
        <div>GOLD: <span id="gold">50</span>G</div>
        <div>공격: <span id="atk">12</span> (+<span id="bonusAtk">0</span>)</div>
        <div class="skill-bar"><div id="skill-fill"></div></div>
        <div style="font-size: 11px; color: #00aaff; margin-top:2px;">K-Key: 광역 스킬</div>
        <div style="margin-top: 8px;">
            <button class="shop-btn" onclick="toggleModal('inventory')">가방</button>
            <button class="shop-btn" onclick="toggleModal('shop')">상점</button>
        </div>
        <div id="msg" style="color: yellow; font-size: 12px; margin-top:8px; font-weight:bold;"></div>
    </div>

    <div id="modal">
        <span class="close-btn" onclick="closeModal()">×</span>
        <div id="modal-content"></div>
    </div>
</div>

<div id="virtual-pad">
    <div>
        <div class="pad-row"><div class="pad-btn" id="btn-up">▲</div></div>
        <div class="pad-row">
            <div class="pad-btn" id="btn-left">◀</div>
            <div class="pad-btn" id="btn-down">▼</div>
            <div class="pad-btn" id="btn-right">▶</div>
        </div>
    </div>
    <div class="pad-btn" id="btn-skill">SKILL</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let TILE_SIZE = 50;
const MAP_SIZE = 12;

// 플레이어 정보 (로드 실패 시 기본값)
let player = {
    x: 1, y: 1, hp: 100, maxHp: 100, gold: 50, atk: 12,
    weaponLvl: 0, potions: 3, lastSkill: 0
};

let gameState = {
    floor: 1, map: [], monsters: [], items: [],
    portal: null, isBossClear: false, 
    theme: { name: "철의 던전", wall: "#444", floor: "#111" }
};

const THEMES = [
    { name: "철의 던전", wall: "#444", floor: "#111" },
    { name: "푸른 이끼 동굴", wall: "#2a4d2e", floor: "#0a1a0d" },
    { name: "용암의 구덩이", wall: "#632111", floor: "#1a0804" },
    { name: "심연의 틈", wall: "#221133", floor: "#0a050f" },
    { name: "황금의 성채", wall: "#665511", floor: "#1a1604" }
];

// 초기 사이즈 조절
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    // 화면 크기에 맞춰 타일 사이즈 조정 (가독성)
    TILE_SIZE = Math.min(canvas.width, canvas.height) / 8;
}

function updateTheme() {
    const idx = Math.floor((gameState.floor - 1) / 5) % THEMES.length;
    gameState.theme = THEMES[idx];
    document.getElementById('theme-name').innerText = gameState.theme.name;
}

function initMap(floor) {
    gameState.floor = floor;
    updateTheme();
    gameState.map = Array.from({length: MAP_SIZE}, () => Array(MAP_SIZE).fill(0));
    
    // 외벽 및 내벽
    for(let y=0; y<MAP_SIZE; y++) {
        for(let x=0; x<MAP_SIZE; x++) {
            if(x===0 || x===MAP_SIZE-1 || y===0 || y===MAP_SIZE-1 || Math.random() < 0.18) {
                gameState.map[y][x] = 1;
            }
        }
    }
    // 시작점과 보스 입구 이동 통로 확보 (모서리 빈 공간 확보)
    gameState.map[1][1] = 0;
    gameState.map[1][MAP_SIZE-2] = 0;
    gameState.map[MAP_SIZE-2][1] = 0;
    gameState.map[MAP_SIZE-2][MAP_SIZE-2] = 0;

    gameState.monsters = [];
    let mCount = 4 + Math.floor(floor/3);
    for(let i=0; i<mCount; i++) spawnEntity('monster');
    
    gameState.items = [];
    gameState.portal = null;
    gameState.isBossClear = false;
    player.x = 1; player.y = 1; // 플레이어 위치 초기화

    document.getElementById('msg').innerText = floor + "층 진입. 몬스터를 소탕하십시오.";
    saveGame();
    updateUI();
}

function spawnEntity(type) {
    let rx, ry, attempts = 0;
    while(attempts < 200) {
        rx = Math.floor(Math.random()*(MAP_SIZE-2))+1;
        ry = Math.floor(Math.random()*(MAP_SIZE-2))+1;
        if(gameState.map[ry][rx] === 0 && (rx !== player.x || ry !== player.y)) {
            if(type === 'monster') {
                gameState.monsters.push({ x: rx, y: ry, hp: 25+(gameState.floor*7), maxHp: 25+(gameState.floor*7), isBoss: false });
            } else if(type === 'boss') {
                gameState.monsters.push({ x: rx, y: ry, hp: 120+(gameState.floor*25), maxHp: 120+(gameState.floor*25), isBoss: true });
            }
            return;
        }
        attempts++;
    }
}

function spawnPortal() {
    // 플레이어와 가장 먼 모서리에 포탈 생성
    const corners = [[1, MAP_SIZE-2], [MAP_SIZE-2, 1], [MAP_SIZE-2, MAP_SIZE-2]];
    const pos = corners[Math.floor(Math.random()*corners.length)];
    gameState.portal = { x: pos[0], y: pos[1] };
    gameState.map[pos[1]][pos[0]] = 0;
    document.getElementById('msg').innerText = "보스 처치! 탈출구가 열렸습니다.";
}

function draw() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // 카메라: 플레이어가 항상 중심
    const camX = canvas.width/2 - (player.x + 0.5) * TILE_SIZE;
    const camY = canvas.height/2 - (player.y + 0.5) * TILE_SIZE;

    // 맵 렌더링
    for(let y=0; y<MAP_SIZE; y++) {
        for(let x=0; x<MAP_SIZE; x++) {
            const tx = x*TILE_SIZE + camX;
            const ty = y*TILE_SIZE + camY;
            if(gameState.map[y][x] === 1) {
                ctx.fillStyle = gameState.theme.wall;
                ctx.fillRect(tx, ty, TILE_SIZE-1, TILE_SIZE-1);
            } else {
                ctx.fillStyle = gameState.theme.floor;
                ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
                ctx.strokeStyle = "#222";
                ctx.strokeRect(tx, ty, TILE_SIZE, TILE_SIZE);
            }
        }
    }

    // 포탈
    if(gameState.portal) {
        ctx.fillStyle = "#00ffcc";
        ctx.shadowBlur = 20; ctx.shadowColor = "#00ffcc";
        ctx.fillRect(gameState.portal.x*TILE_SIZE+camX+5, gameState.portal.y*TILE_SIZE+camY+5, TILE_SIZE-10, TILE_SIZE-10);
        ctx.shadowBlur = 0;
    }

    // 아이템
    gameState.items.forEach(it => {
        ctx.fillStyle = it.type === 'gold' ? 'gold' : '#ff00ff';
        ctx.beginPath();
        ctx.arc(it.x*TILE_SIZE+camX+TILE_SIZE/2, it.y*TILE_SIZE+camY+TILE_SIZE/2, TILE_SIZE/5, 0, Math.PI*2);
        ctx.fill();
    });

    // 몬스터
    gameState.monsters.forEach(m => {
        const mx = m.x*TILE_SIZE+camX;
        const my = m.y*TILE_SIZE+camY;
        ctx.fillStyle = m.isBoss ? '#f0f' : '#f44';
        ctx.fillRect(mx+TILE_SIZE*0.2, my+TILE_SIZE*0.2, TILE_SIZE*0.6, TILE_SIZE*0.6);
        // HP Bar
        ctx.fillStyle = '#333'; ctx.fillRect(mx+5, my-8, TILE_SIZE-10, 5);
        ctx.fillStyle = '#f00'; ctx.fillRect(mx+5, my-8, (TILE_SIZE-10)*(m.hp/m.maxHp), 5);
    });

    // 플레이어
    ctx.fillStyle = '#00aaff';
    ctx.shadowBlur = 15; ctx.shadowColor = '#00aaff';
    ctx.fillRect(player.x*TILE_SIZE+camX+TILE_SIZE*0.15, player.y*TILE_SIZE+camY+TILE_SIZE*0.15, TILE_SIZE*0.7, TILE_SIZE*0.7);
    ctx.shadowBlur = 0;

    // 스킬 쿨타임
    let now = Date.now();
    let skillProgress = Math.min(100, ((now - player.lastSkill) / 5000) * 100);
    document.getElementById('skill-fill').style.width = skillProgress + "%";

    requestAnimationFrame(draw);
}

function move(dx, dy) {
    let nx = player.x + dx;
    let ny = player.y + dy;
    if(nx<0 || nx>=MAP_SIZE || ny<0 || ny>=MAP_SIZE || gameState.map[ny][nx] === 1) return;

    let mIdx = gameState.monsters.findIndex(m => m.x === nx && m.y === ny);
    if(mIdx > -1) {
        let dmg = player.atk + (player.weaponLvl*6);
        gameState.monsters[mIdx].hp -= dmg;
        if(gameState.monsters[mIdx].hp <= 0) {
            let m = gameState.monsters[mIdx];
            let drops = m.isBoss ? 5 : 1;
            for(let i=0; i<drops; i++) {
                gameState.items.push({ x: m.x, y: m.y, type: Math.random()<0.2 ? 'potion':'gold', amount: 15+gameState.floor*3 });
            }
            if(m.isBoss) { gameState.isBossClear = true; spawnPortal(); }
            gameState.monsters.splice(mIdx, 1);
            if(gameState.monsters.length === 0 && !gameState.isBossClear) spawnEntity('boss');
        } else {
            player.hp -= Math.floor(gameState.floor * 1.3);
        }
    } else {
        player.x = nx; player.y = ny;
        gameState.items = gameState.items.filter(it => {
            if(it.x === player.x && it.y === player.y) {
                if(it.type === 'gold') player.gold += it.amount;
                else player.potions++;
                return false;
            }
            return true;
        });
        if(gameState.portal && player.x === gameState.portal.x && player.y === gameState.portal.y) {
            if(confirm("다음 층으로 가시겠습니까?")) initMap(gameState.floor + 1);
        }
    }
    if(player.hp <= 0) { alert("사망! 1층부터 다시 시작합니다."); localStorage.clear(); location.reload(); }
    updateUI();
}

function castSkill() {
    if(Date.now() - player.lastSkill < 5000) return;
    player.lastSkill = Date.now();
    document.getElementById('msg').innerText = "푸른 마력 폭발 발생!";
    gameState.monsters.forEach(m => { m.hp -= (player.atk * 4); });
    gameState.monsters = gameState.monsters.filter(m => {
        if(m.hp <= 0) {
            if(m.isBoss) { gameState.isBossClear = true; spawnPortal(); }
            return false;
        }
        return true;
    });
    if(gameState.monsters.length === 0 && !gameState.isBossClear) spawnEntity('boss');
    updateUI();
}

function updateUI() {
    document.getElementById('cur-floor').innerText = gameState.floor;
    document.getElementById('hp').innerText = player.hp;
    document.getElementById('maxHp').innerText = player.maxHp;
    document.getElementById('gold').innerText = player.gold;
    document.getElementById('atk').innerText = player.atk;
    document.getElementById('bonusAtk').innerText = player.weaponLvl * 6;
}

function toggleModal(type) {
    const m = document.getElementById('modal');
    const c = document.getElementById('modal-content');
    m.style.display = 'block';
    if(type === 'inventory') {
        c.innerHTML = `<h2 style="color:#00aaff">가방</h2>
            <div class="item-row">포션: ${player.potions}개 <button class="shop-btn" onclick="usePotion()">마시기</button></div>
            <div class="item-row">무기: +${player.weaponLvl} 강화됨</div>`;
    } else {
        let cost = (player.weaponLvl+1)*70;
        c.innerHTML = `<h2 style="color:#00aaff">상점</h2>
            <div class="item-row">포션 (30G) <button class="shop-btn" onclick="buy('p')">구매</button></div>
            <div class="item-row">강화 (${cost}G) <button class="shop-btn" onclick="buy('u')">강화</button></div>`;
    }
}
function closeModal() { document.getElementById('modal').style.display = 'none'; }
function usePotion() {
    if(player.potions > 0) { player.potions--; player.hp = Math.min(player.maxHp, player.hp+40); updateUI(); toggleModal('inventory'); }
}
function buy(t) {
    if(t==='p' && player.gold >= 30) { player.gold -= 30; player.potions++; }
    else if(t==='u') {
        let cost = (player.weaponLvl+1)*70;
        if(player.gold >= cost) { player.gold -= cost; player.weaponLvl++; }
    }
    updateUI(); toggleModal('shop');
}

// 조작
window.addEventListener('keydown', e => {
    if(e.key.includes('Arrow')) e.preventDefault();
    if(e.key === 'ArrowUp') move(0, -1);
    if(e.key === 'ArrowDown') move(0, 1);
    if(e.key === 'ArrowLeft') move(-1, 0);
    if(e.key === 'ArrowRight') move(1, 0);
    if(e.key.toLowerCase() === 'k') castSkill();
});
document.getElementById('btn-up').onclick = () => move(0, -1);
document.getElementById('btn-down').onclick = () => move(0, 1);
document.getElementById('btn-left').onclick = () => move(-1, 0);
document.getElementById('btn-right').onclick = () => move(1, 0);
document.getElementById('btn-skill').onclick = () => castSkill();

function saveGame() { localStorage.setItem('rpg_100f_save', JSON.stringify({player, floor: gameState.floor})); }
function loadGame() {
    const s = localStorage.getItem('rpg_100f_save');
    if(s) { 
        const d = JSON.parse(s); 
        player = d.player; 
        initMap(d.floor); 
    } else {
        initMap(1);
    }
}

// 초기화 순서 강제
resize();
window.addEventListener('resize', resize);
loadGame();
draw(); // 루프 시작
</script>
</body>
</html>
