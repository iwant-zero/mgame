<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>100층 던전: 푸른 마력의 잔상</title>
    <style>
        /* 화면이 하얗게 보이지 않도록 기본 배경을 검은색으로 고정 */
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000; overflow: hidden; 
            font-family: 'Malgun Gothic', sans-serif; 
        }
        canvas { 
            display: block; background: #000; 
            image-rendering: pixelated; /* 도트 그래픽 선명도 보정 */
        }
        
        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .hud { 
            position: absolute; top: 10px; left: 10px; 
            background: rgba(0,0,0,0.85); padding: 12px; border-radius: 8px; 
            border: 2px solid #00aaff; pointer-events: auto; font-size: 13px; color: #fff;
        }
        .skill-bar { margin: 8px 0; height: 8px; background: #333; border-radius: 4px; overflow: hidden; width: 120px; }
        #skill-fill { width: 0%; height: 100%; background: #00aaff; }
        .shop-btn { background: #222; color: #00aaff; border: 1px solid #00aaff; padding: 5px 10px; cursor: pointer; font-weight: bold; margin-top: 5px; }

        #modal { 
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: #111; padding: 20px; border: 2px solid #00aaff; border-radius: 10px; 
            pointer-events: auto; min-width: 260px; z-index: 1000; color: #fff; text-align: center;
        }
        
        #virtual-pad { position: absolute; bottom: 20px; left: 20px; display: none; pointer-events: auto; }
        .pad-row { display: flex; justify-content: center; }
        .pad-btn { width: 55px; height: 55px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); border-radius: 10px; margin: 2px; text-align: center; line-height: 55px; font-size: 20px; color: #fff; user-select: none; }
        
        @media (max-width: 768px) { #virtual-pad { display: flex; align-items: flex-end; } }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-container">
    <div class="hud">
        <div style="font-weight: bold; color: #00aaff; font-size: 15px;">[ <span id="cur-floor">1</span>F ] <span id="theme-name">철의 던전</span></div>
        <div style="margin-top: 5px;">HP: <span id="hp">100</span> / <span id="maxHp">100</span></div>
        <div>GOLD: <span id="gold">50</span>G</div>
        <div class="skill-bar"><div id="skill-fill"></div></div>
        <button class="shop-btn" onclick="toggleModal('inventory')">가방</button>
        <button class="shop-btn" onclick="toggleModal('shop')">상점</button>
        <div id="msg" style="color: #ffff00; font-size: 11px; margin-top: 8px; font-weight: bold;"></div>
    </div>
    <div id="modal"><div id="modal-content"></div><button class="shop-btn" onclick="closeModal()">닫기</button></div>
</div>

<div id="virtual-pad">
    <div>
        <div class="pad-row"><div class="pad-btn" id="btn-up">▲</div></div>
        <div class="pad-row"><div class="pad-btn" id="btn-left">◀</div><div class="pad-btn" id="btn-down">▼</div><div class="pad-btn" id="btn-right">▶</div></div>
    </div>
    <div class="pad-btn" style="border-radius: 50%; margin-left: 15px; width: 65px; height: 65px;" id="btn-skill">스킬</div>
</div>

<script>
/**
 * [핵심 해결] 캔버스 및 게임 데이터 초기화 정의
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const MAP_SIZE = 15;
let TILE_SIZE = 40;

let player = { x: 1, y: 1, hp: 100, maxHp: 100, gold: 50, atk: 15, weaponLvl: 0, potions: 3, lastSkill: 0 };
let gameState = { floor: 1, map: [], monsters: [], items: [], portal: null, isBossClear: false, theme: { wall: "#444", floor: "#111" } };

const THEMES = [
    { name: "철의 던전", wall: "#444", floor: "#111" },
    { name: "이끼 동굴", wall: "#2a4d2e", floor: "#0a1a0d" },
    { name: "용암 구덩이", wall: "#632111", floor: "#1a0804" },
    { name: "심연의 틈", wall: "#221133", floor: "#0a050f" }
];

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const minSide = Math.min(canvas.width, canvas.height);
    TILE_SIZE = Math.max(20, Math.floor(minSide / (MAP_SIZE + 2))); 
}

function initMap(floor) {
    gameState.floor = floor;
    gameState.theme = THEMES[Math.floor((floor-1)/5) % THEMES.length];
    document.getElementById('theme-name').innerText = gameState.theme.name;

    // 맵 생성: 전체 벽
    gameState.map = Array.from({length: MAP_SIZE}, () => Array(MAP_SIZE).fill(1));
    
    // 랜덤 워커 알고리즘: 모든 통로 연결 보장
    let curX = 1, curY = 1;
    gameState.map[curY][curX] = 0;
    let floorTiles = 0;
    while(floorTiles < (MAP_SIZE * MAP_SIZE) * 0.4) {
        let dir = Math.floor(Math.random() * 4);
        let dx = [0, 0, -1, 1][dir], dy = [-1, 1, 0, 0][dir];
        if(curX + dx > 0 && curX + dx < MAP_SIZE - 1 && curY + dy > 0 && curY + dy < MAP_SIZE - 1) {
            curX += dx; curY += dy;
            if(gameState.map[curY][curX] === 1) { gameState.map[curY][curX] = 0; floorTiles++; }
        }
    }

    player.x = 1; player.y = 1;
    gameState.monsters = [];
    gameState.items = [];
    gameState.portal = null;
    gameState.isBossClear = false;

    // 몬스터 배치
    for(let i=0; i < 5 + Math.floor(floor/4); i++) spawnEntity('monster');

    document.getElementById('msg').innerText = floor + "층 진입. 적을 소탕하세요.";
    updateUI();
}

function spawnEntity(type) {
    let attempts = 0;
    while(attempts < 500) {
        let rx = Math.floor(Math.random()*MAP_SIZE), ry = Math.floor(Math.random()*MAP_SIZE);
        if(gameState.map[ry][rx] === 0 && (rx !== 1 || ry !== 1)) {
            if(type === 'monster') gameState.monsters.push({ x: rx, y: ry, hp: 30+(gameState.floor*8), maxHp: 30+(gameState.floor*8), isBoss: false });
            else if(type === 'boss') gameState.monsters.push({ x: rx, y: ry, hp: 150+(gameState.floor*30), maxHp: 150+(gameState.floor*30), isBoss: true });
            return;
        }
        attempts++;
    }
}

function spawnPortal() {
    for(let y=MAP_SIZE-2; y>0; y--) {
        for(let x=MAP_SIZE-2; x>0; x--) {
            if(gameState.map[y][x] === 0) { gameState.portal = { x, y }; return; }
        }
    }
}

function draw() {
    // 배경 지우기
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    const offsetX = (canvas.width - MAP_SIZE * TILE_SIZE) / 2;
    const offsetY = (canvas.height - MAP_SIZE * TILE_SIZE) / 2;

    // 맵 그리기
    for(let y=0; y<MAP_SIZE; y++) {
        for(let x=0; x<MAP_SIZE; x++) {
            const tx = x*TILE_SIZE + offsetX, ty = y*TILE_SIZE + offsetY;
            ctx.fillStyle = gameState.map[y][x] === 1 ? gameState.theme.wall : gameState.theme.floor;
            ctx.fillRect(tx, ty, TILE_SIZE-1, TILE_SIZE-1);
        }
    }

    // 포탈
    if(gameState.portal) {
        ctx.fillStyle = "#00ffcc";
        ctx.fillRect(gameState.portal.x*TILE_SIZE+offsetX+2, gameState.portal.y*TILE_SIZE+offsetY+2, TILE_SIZE-4, TILE_SIZE-4);
    }

    // 아이템
    gameState.items.forEach(it => {
        ctx.fillStyle = it.type === 'gold' ? 'gold' : '#ff00ff';
        ctx.beginPath(); ctx.arc(it.x*TILE_SIZE+offsetX+TILE_SIZE/2, it.y*TILE_SIZE+offsetY+TILE_SIZE/2, TILE_SIZE/4, 0, Math.PI*2); ctx.fill();
    });

    // 몬스터
    gameState.monsters.forEach(m => {
        const mx = m.x*TILE_SIZE+offsetX, my = m.y*TILE_SIZE+offsetY;
        ctx.fillStyle = m.isBoss ? '#f0f' : '#f44';
        ctx.fillRect(mx+TILE_SIZE*0.2, my+TILE_SIZE*0.2, TILE_SIZE*0.6, TILE_SIZE*0.6);
        ctx.fillStyle = '#f00'; ctx.fillRect(mx+2, my-4, (TILE_SIZE-4)*(m.hp/m.maxHp), 3);
    });

    // 플레이어 (푸른 마력의 잔상)
    ctx.fillStyle = '#00aaff';
    ctx.shadowBlur = 10; ctx.shadowColor = '#00aaff';
    ctx.fillRect(player.x*TILE_SIZE+offsetX+TILE_SIZE*0.2, player.y*TILE_SIZE+offsetY+TILE_SIZE*0.2, TILE_SIZE*0.6, TILE_SIZE*0.6);
    ctx.shadowBlur = 0;

    // 스킬 바 업데이트
    let skillProgress = Math.min(100, ((Date.now() - player.lastSkill) / 5000) * 100);
    document.getElementById('skill-fill').style.width = skillProgress + "%";

    requestAnimationFrame(draw);
}

function move(dx, dy) {
    let nx = player.x + dx, ny = player.y + dy;
    if(nx < 0 || nx >= MAP_SIZE || ny < 0 || ny >= MAP_SIZE || gameState.map[ny][nx] === 1) return;

    let mIdx = gameState.monsters.findIndex(m => m.x === nx && m.y === ny);
    if(mIdx > -1) {
        let m = gameState.monsters[mIdx];
        m.hp -= (player.atk + player.weaponLvl * 10);
        if(m.hp <= 0) {
            gameState.items.push({ x: m.x, y: m.y, type: Math.random() < 0.2 ? 'potion' : 'gold', amount: 20 + gameState.floor * 5 });
            if(m.isBoss) { gameState.isBossClear = true; spawnPortal(); document.getElementById('msg').innerText = "출구가 열렸습니다!"; }
            gameState.monsters.splice(mIdx, 1);
            if(gameState.monsters.length === 0 && !gameState.isBossClear) { spawnEntity('boss'); document.getElementById('msg').innerText = "보스 출현!"; }
        } else { player.hp -= (5 + gameState.floor); }
    } else {
        player.x = nx; player.y = ny;
        gameState.items = gameState.items.filter(it => {
            if(it.x === player.x && it.y === player.y) { if(it.type === 'gold') player.gold += it.amount; else player.potions++; return false; }
            return true;
        });
        if(gameState.portal && player.x === gameState.portal.x && player.y === gameState.portal.y) {
            if(confirm("다음 층으로 가시겠습니까?")) initMap(gameState.floor + 1);
        }
    }
    if(player.hp <= 0) { alert("게임 오버"); location.reload(); }
    updateUI();
}

function castSkill() {
    if(Date.now() - player.lastSkill < 5000) return;
    player.lastSkill = Date.now();
    gameState.monsters.forEach(m => m.hp -= (player.atk * 5));
    gameState.monsters = gameState.monsters.filter(m => {
        if(m.hp <= 0) { if(m.isBoss) { gameState.isBossClear = true; spawnPortal(); } return false; }
        return true;
    });
    if(gameState.monsters.length === 0 && !gameState.isBossClear) spawnEntity('boss');
}

function updateUI() {
    document.getElementById('cur-floor').innerText = gameState.floor;
    document.getElementById('hp').innerText = player.hp;
    document.getElementById('maxHp').innerText = player.maxHp;
    document.getElementById('gold').innerText = player.gold;
}

function toggleModal(type) {
    const m = document.getElementById('modal'), c = document.getElementById('modal-content');
    m.style.display = 'block';
    if(type === 'inventory') c.innerHTML = `<h3>가방</h3><p>포션: ${player.potions}개</p><button class="shop-btn" onclick="usePotion()">사용</button>`;
    else c.innerHTML = `<h3>상점</h3><p>강화 (+${player.weaponLvl})</p><button class="shop-btn" onclick="buyUpgrade()">무기 강화 (${(player.weaponLvl+1)*100}G)</button>`;
}
function closeModal() { document.getElementById('modal').style.display = 'none'; }
function usePotion() { if(player.potions > 0) { player.potions--; player.hp = Math.min(player.maxHp, player.hp+50); updateUI(); closeModal(); } }
function buyUpgrade() { 
    let cost = (player.weaponLvl+1)*100;
    if(player.gold >= cost) { player.gold -= cost; player.weaponLvl++; updateUI(); closeModal(); }
}

// 초기화 실행
window.onload = () => {
    resize();
    initMap(1);
    draw();
};

window.onresize = resize;
window.onkeydown = (e) => {
    if(e.key === 'ArrowUp') move(0, -1); if(e.key === 'ArrowDown') move(0, 1);
    if(e.key === 'ArrowLeft') move(-1, 0); if(e.key === 'ArrowRight') move(1, 0);
    if(e.key.toLowerCase() === 'k') castSkill();
};
document.getElementById('btn-up').onclick = () => move(0, -1);
document.getElementById('btn-down').onclick = () => move(0, 1);
document.getElementById('btn-left').onclick = () => move(-1, 0);
document.getElementById('btn-right').onclick = () => move(1, 0);
document.getElementById('btn-skill').onclick = castSkill;
</script>
</body>
</html>
